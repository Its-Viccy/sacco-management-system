<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Withdraw Funds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Withdraw Funds</h4>
        </div>
        <div class="card-body">
            <p>Account: <strong>{{ account.account_number }}</strong></p>
            <p class="text-muted">Available Balance: <strong>KES {{ account.balance|floatformat:2 }}</strong></p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Amount (KES)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" required placeholder="e.g. 1000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Payout Method</label>
                    <select name="payment_method" class="form-select">
                        <option value="mpesa">M-Pesa</option>
                        <option value="bank">Bank Transfer</option>
                        <option value="cash">Cash</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Reason / Note</label>
                    <textarea name="description" class="form-control" rows="2" placeholder="Emergency withdrawal"></textarea>
                </div>
                <button type="submit" class="btn btn-danger w-100">Confirm Withdrawal</button>
                <a href="{% url 'account_detail' account.id %}" class="btn btn-link w-100 text-center mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
