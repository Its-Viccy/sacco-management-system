<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply for Loan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 550px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">New Loan Application</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Select Member</label>
                    <select name="member_id" class="form-select" required>
                        {% for member in members %}
                            <option value="{{ member.id }}">{{ member.member_number }} - {{ member.first_name }} {{ member.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Principal Amount (KES)</label>
                    <input type="number" step="0.01" name="principal_amount" class="form-control" required placeholder="e.g. 50000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Interest Rate (%)</label>
                    <input type="number" step="0.1" name="interest_rate" class="form-control" value="12.0" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Duration (Months)</label>
                    <select name="duration_months" class="form-select">
                        <option value="6">6 Months</option>
                        <option value="12" selected>12 Months</option>
                        <option value="24">24 Months</option>
                        <option value="36">36 Months</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit Application</button>
                <a href="{% url 'loan_list' %}" class="btn btn-link w-100 text-center mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
