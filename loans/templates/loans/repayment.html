<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Repayment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Record Repayment</h4>
        </div>
        <div class="card-body">
            <p>Loan Ref: <strong>{{ loan.loan_number }}</strong></p>
            <p class="text-muted">Outstanding Balance: <strong>KES {{ loan.balance|floatformat:2 }}</strong></p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Repayment Amount (KES)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" required placeholder="e.g. 5000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select">
                        <option value="mpesa">M-Pesa</option>
                        <option value="bank">Bank Transfer</option>
                        <option value="cash">Cash</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Remarks</label>
                    <textarea name="remarks" class="form-control" rows="2" placeholder="Monthly installment repayment"></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Submit Payment</button>
                <a href="{% url 'loan_detail' loan.id %}" class="btn btn-link w-100 text-center mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
